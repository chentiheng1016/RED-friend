repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^(erp_workflows/|specs/|agent$|image_analysis_summary\.txt$)
      - id: trailing-whitespace
        exclude: ^(erp_workflows/|specs/|agent$|image_analysis_summary\.txt$)

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/python -m ruff check --select E9,F63,F7,F82,F811
        language: system
        types: [python]

      - id: detect-secrets
        name: detect secrets
        entry: .venv/bin/detect-secrets-hook --baseline .secrets.baseline
        language: system

      - id: smoke-tests
        name: smoke tests
        entry: .venv/bin/python scripts/run_precommit_smoke.py
        language: system
        pass_filenames: false
