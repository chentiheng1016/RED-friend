line-length = 120

# 明確釘住規則集（2026-08-12）。原本這裡沒有 select，等於吃 ruff 的**預設**——
# 而 ruff 0.16 把預設從 `E4,E7,E9,F` 大幅擴充（BLE/DTZ/S/SIM/UP/I/RUF/FURB…）。
# #375 把下限提到 >=0.16.2、本機一升級，`make lint` 當場從全綠變成 4,014 個錯，
# 但**沒有任何 CI 抓得到**：workflow 只跑 pre-commit（那邊自己釘 E9,F63,F7,F82）、
# tests 與 audit，從來不跑 make lint。
#
# 這裡把「一直以來實際生效的那組」寫死，讓 lint 結果不再隨 ruff 版本漂移。
# 新冒出來的那批規則（blind-except 1316 筆、datetime-without-tz 278 筆…）多半是
# 真的可以改進的點，但那是另一個決定，不該由一次相依升級默默替我們決定。
[lint]
select = ["E4", "E7", "E9", "F", "S110", "S112"]

# Legacy compatibility modules intentionally keep imported names available for
# tests, monkeypatching, and old entrypoints. Several tests also insert the repo
# root into sys.path before importing local modules.
[lint.per-file-ignores]
"agent.py" = ["F401", "E402"]
"agent_daemon.py" = ["F401", "E402"]
"agent_core/**/*.py" = ["F401"]
"agent_core/log_redact.py" = ["E402", "S110", "S112"]  # +3 處靜默例外
"agent_core/status_center.py" = ["E402", "S110", "S112"]  # +2 處靜默例外
"agent_core/web_server/app.py" = ["E402", "S110", "S112"]  # +1 處靜默例外
"launchd/scripts/*.py" = ["F401", "E402"]
"scripts/*.py" = ["F401"]
"skills/*.py" = ["F401"]
"tests/**/*.py" = ["F401", "E402"]

# ── 靜默例外處理的「已知債」清單（2026-08-12 建立）─────────────────────────
# S110/S112 = `except …: pass` / `except …: continue`，例外被完全吞掉、不留痕跡。
# 規則已開，讓**新的**靜默處理進不來；既有 215 處逐檔列在下面當可見的債，
# 清一個檔就刪一行，數字只能往下走。
#
# 清法看情況，不是一律加 log：
#   • 解析類（json.loads/strptime/int）→ 收窄成 (ValueError, TypeError)：預期
#     情形行為不變、意外型別浮出來。已清 60 處（見同批 commit）。
#   • best-effort 副作用（快取寫入、簽名查詢）→ logger.debug 記一行。
#   • 熱迴圈內（遞迴走訪、逐列掃描）→ **不要**加 log，會洗爆日誌。
#   • log 失敗的 except（log-in-log）→ 加 log 會遞迴，同上。
