<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token or '' }}">
<title>{% block title %}小紅員工入口{% endblock %}</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
       background: #f5f5f5; color: #333; min-height: 100vh; }
nav { background: #c0392b; color: white; padding: 12px 24px;
      display: flex; align-items: center; gap: 16px; }
nav .brand { font-weight: 700; font-size: 1.1rem; flex: 1; }
nav a { color: white; text-decoration: none; font-size: 0.9rem; opacity: 0.9; }
nav a:hover { opacity: 1; text-decoration: underline; }
.container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
.card { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
        padding: 24px; margin-bottom: 16px; }
.btn { display: inline-block; padding: 8px 18px; border-radius: 6px; border: none;
       cursor: pointer; font-size: 0.95rem; text-decoration: none; }
.btn-primary { background: #c0392b; color: white; }
.btn-primary:hover { background: #a93226; }
.btn-secondary { background: #eee; color: #333; }
.btn-secondary:hover { background: #ddd; }
.btn-confirm { background: #e67e22; color: white; }
.btn-confirm:hover { background: #ca6f1e; }
{% block extra_style %}{% endblock %}
</style>
</head>
<body>
<nav>
  <span class="brand">🔴 小紅入口</span>
  {% if user is defined and user %}
    <span style="font-size:.9rem; opacity:.8">{{ user.name }}</span>
    <a href="/auth/logout">登出</a>
  {% endif %}
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
</body>
</html>
